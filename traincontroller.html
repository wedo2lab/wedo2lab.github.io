<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚄 Train Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    touch-action: none;
    overflow: hidden;
    margin:0;
    font-family:'Orbitron',sans-serif;
    background: radial-gradient(circle at center, #0a0f14, #000);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.panel {
    background:#111;
    border-radius:30px;
    padding:30px;
    width:360px;
    box-shadow:0 0 40px rgba(0,255,255,0.2), inset 0 0 20px #000;
    text-align:center;
}
h1 { color:#00eaff; }
.status { margin-bottom:15px; }
.dot { width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;background:red; }
.connected .dot { background:#00ff88;box-shadow:0 0 10px #00ff88; }

button.connect {padding:10px 20px;border:none;border-radius:10px;background:#00eaff;color:#000;cursor:pointer; }
#speed-value { margin-top:40px; color:#00eaff;font-size:18px; }

.knob {
    width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle,#444,#111);
    display:inline-flex;justify-content:center;align-items:center;
    margin:12px;cursor:pointer;margin-bottom: 20px;
    box-shadow: inset 0 0 10px #000, 0 0 15px rgba(0,255,255,0.2);
}
.knob.active { box-shadow:0 0 20px #ffe600; }
.knob.disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }

.lever-container { margin:40px 0; }

.track {
    width:12px;height:260px;background:#222;margin:0 auto;
    border-radius:10px;position:relative;
}
.track.disabled { opacity:0.3; pointer-events:none; }

.handle {
    width:50px;height:50px;
    background:linear-gradient(45deg,#00eaff,#007bff);
    border-radius:50%;position:absolute;left:-19px;
    cursor:pointer;box-shadow:0 0 15px #00eaff;
}
.handle.disabled { cursor:not-allowed; filter:grayscale(1); pointer-events:none; }

#browser-warning {
    display:none;
    position:fixed;top:0;left:0;width:100%;
    background:#ff523b;
    color:#fff;
    text-align:center;
    padding:10px;
    font-size:14px;
    z-index:9999;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.7;
    line-height: 1.6;
    text-align: center;
}

.footer a {
    color: #00eaff;
    text-decoration: none;
}

.footer a:hover {
    text-shadow: 0 0 8px #00eaff;
}

.fullscreen-btn {
    position: fixed;
    bottom: 15px;
    right: 15px;

    width: 44px;
    height: 44px;
    border-radius: 50%;

    background: radial-gradient(circle, #00eaff, #007bff);

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 20px;
    color: #000;

    cursor: pointer;

    box-shadow: 0 0 12px rgba(0,255,255,0.5), inset 0 0 8px #000;

    transition: transform 0.15s ease, box-shadow 0.15s ease;

    user-select: none;
    -webkit-user-select: none;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

@media (hover: hover) {
    .fullscreen-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 20px #00eaff;
    }
}

.fullscreen-btn:active {
    transform: scale(0.92);
    box-shadow: 0 0 8px #00eaff;
}

.fullscreen-btn::before {
    content: "";
    position: absolute;
    inset: -10px;
}

.fullscreen-btn svg {
    pointer-events: none;
}

.alert-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
}

.alert-box {
    background: #111;
    padding: 25px;
    border-radius: 20px;
    width: 280px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,80,60,0.4), inset 0 0 20px #000;
    animation: pop 0.2s ease;
}

@keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.alert-title {
    color: #ff523b;
    font-size: 18px;
    margin-bottom: 10px;
}

.alert-message {
    font-size: 14px;
    margin-bottom: 20px;
}

.alert-btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    color: #000;
    cursor: pointer;
}

.alert-btn:active {
    transform: scale(0.95);
}
</style>
</head>
<body>
<div id="custom-alert" class="alert-overlay">
    <div class="alert-box">
        <div class="alert-title">⚠️ Warning</div>
        <div class="alert-message" id="alert-message">
            High current detected!
        </div>
        <button class="alert-btn" onclick="closeAlert()">OK</button>
    </div>
</div>

<div id="browser-warning">
    ⚠️ This app only works properly in Google Chrome. Please switch to Google Chrome or <a style="color:#fff" href="https://www.google.com/chrome/" target="_blank">install it</a>.
</div>

<div class="fullscreen-btn" onclick="toggleFullscreen()" id="fsBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
            stroke="black" stroke-width="2" stroke-linecap="round"/>
    </svg>
</div>

<div class="panel">
    <h1>Train Control</h1>

    <div class="status" id="status">
        <span class="dot"></span> Disconnected
    </div>

    <button class="connect" onclick="toggleConnection()" id="connectBtn">Connect</button>

    <div class="lever-container">
        <div class="track disabled" id="track">
            <div class="handle disabled" id="handle"></div>
        </div>
        <div id="speed-value">Speed: 0</div>
    </div>

    <div>
        <div class="knob disabled" id="brakeKnob" onclick="brake()"><span>Brake</span></div>
        <div class="knob disabled" id="lightsKnob" onclick="toggleLights()"><span>Lights</span></div>
    </div>
    
    <div class="footer">
        &copy; 2026 WeDo Train Controller by jvs333-dev
        <a href="https://github.com/wedo2lab/wedo2lab.github.io" target="_blank">GitHub</a>
    </div>
</div>

<script>
const WEDO_CONTROL_SERVICE_UUID = "00004f0e-1212-efde-1523-785feabcd123";
const WEDO_SERVICE_UUID = "00001523-1212-efde-1523-785feabcd123";
const WEDO_OUTPUT_UUID  = "00001565-1212-efde-1523-785feabcd123";
const WEDO_DISCONNECT_UUID = "0000152e-1212-efde-1523-785feabcd123";
const WEDO_PORT_UUID = "00001527-1212-efde-1523-785feabcd123";
const WEDO_HIGH_CURRENT_ALERT_UUID = "00001529-1212-efde-1523-785feabcd123";


const WEDO_SENSORS = [
    { key: [1,0,2,1,0,0,0,1,0,0,0], value: "Motor" },
    { key: [1,1,2,1,0,0,0,1,0,0,0], value: "Motor" },
    { key: [1,0,8,1,0,0,0,1,0,0,0], value: "Light" },
    { key: [1,1,8,1,0,0,0,1,0,0,0], value: "Light" },
    { key: [0], value: "Nothing" }
];

function equals(a,b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }
function findSensor(input){ return WEDO_SENSORS.find(e=>equals(e.key,input))?.value || "Unknown"; }

let device, output_characteristic, disconnect_characteristic, port_characteristic;
let motor_ports=[], lights_port=null, lightsOn=false;
let writeQueue = Promise.resolve();

const statusEl = document.getElementById("status");
const lightsKnob = document.getElementById("lightsKnob");
const brakeKnob = document.getElementById("brakeKnob");
const handle = document.getElementById("handle");
const track = document.getElementById("track");
const fsBtn = document.getElementById("fsBtn");

function showAlert(message){
    document.getElementById("alert-message").textContent = message;
    document.getElementById("custom-alert").style.display = "flex";
    handle.classList.add("disabled");
    track.classList.add("disabled");
}

function closeAlert(){
    document.getElementById("custom-alert").style.display = "none";
    handle.classList.remove("disabled");
    track.classList.remove("disabled");
}

function toggleFullscreen(){
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.error);
    } else {
        document.exitFullscreen();
    }
}

function updateFSIcon(){
    fsBtn.innerHTML = document.fullscreenElement
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none">
             <path d="M6 6l12 12M18 6L6 18"
             stroke="black" stroke-width="2" stroke-linecap="round"/>
           </svg>`
        : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none">
             <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
             stroke="black" stroke-width="2" stroke-linecap="round"/>
           </svg>`;
}

document.addEventListener("fullscreenchange", updateFSIcon);

function updateUIStates(){
    const motorActive = motor_ports.length > 0;
    const lightsActive = lights_port !== null;
    const connected = device?.gatt?.connected;

    handle.classList.toggle("disabled", !motorActive || !connected);
    track.classList.toggle("disabled", !motorActive || !connected);

    lightsKnob.classList.toggle("disabled", !lightsActive || !connected);
    brakeKnob.classList.toggle("disabled", !motorActive || !connected);

    if(!motorActive||!connected){
        setSpeed(0, true);
    }

    if(!lightsActive){
        lightsKnob.classList.remove("active");
        lightsOn=false;
    }
}

function setConnectedUI(connected){
    const btn = document.getElementById("connectBtn");
    if(connected){
        statusEl.innerHTML='<span class="dot"></span> Connected';
        statusEl.classList.add("connected");
        btn.textContent="Disconnect";
    } else {
        statusEl.innerHTML='<span class="dot"></span> Disconnected';
        statusEl.classList.remove("connected");
        btn.textContent="Connect";
    }
    updateUIStates();
}

async function connect(){
    device = await navigator.bluetooth.requestDevice({
        acceptAllDevices:true,
        optionalServices:[WEDO_SERVICE_UUID,WEDO_CONTROL_SERVICE_UUID]
    });

    setConnectedUI(true);

    device.addEventListener('gattserverdisconnected', ()=> setConnectedUI(false));

    const server = await device.gatt.connect();
    const output_service = await server.getPrimaryService(WEDO_CONTROL_SERVICE_UUID);
    const service = await server.getPrimaryService(WEDO_SERVICE_UUID);

    high_current_alert_characteristic = await service.getCharacteristic(WEDO_HIGH_CURRENT_ALERT_UUID);
    output_characteristic = await output_service.getCharacteristic(WEDO_OUTPUT_UUID);
    disconnect_characteristic = await service.getCharacteristic(WEDO_DISCONNECT_UUID);
    port_characteristic = await service.getCharacteristic(WEDO_PORT_UUID);

    await port_characteristic.startNotifications();

    port_characteristic.addEventListener('characteristicvaluechanged',(event)=>{
        const value = new Uint8Array(event.target.value.buffer);
        const port = value[0];
        const type = findSensor(value.slice(1));
        console.log("Port update:", port, type, value);

        if(type==="Motor"){
        if(!motor_ports.includes(port)){
            motor_ports.push(port);
            }
        }
        else if(type==="Light") lights_port=port;
        else if(type==="Nothing"){
            motor_ports = motor_ports.filter(p => p !== port);
            if(lights_port===port) lights_port=null;
        }

        updateUIStates();
    });

    await high_current_alert_characteristic.startNotifications();

    high_current_alert_characteristic.addEventListener('characteristicvaluechanged',(event)=>{
        const value = new Uint8Array(event.target.value.buffer);
        if (value[0] === 0x01) {
            brake();
            showAlert("High current detected! Please check your motors.");
        }
    });

    updateUIStates();
}

function safeWrite(data){
    if(!output_characteristic) return;

    writeQueue = writeQueue.then(() =>
        output_characteristic.writeValue(data)
    ).catch(console.error);
}

function disconnect(){
    if(device?.gatt?.connected){
        disconnect_characteristic.writeValue(new Uint8Array([0x01]));
        device.gatt.disconnect();
    }
    output_characteristic=null;
    motor_ports=[];
    lights_port=null;
    lightsOn=false;
    updateUIStates();
    setConnectedUI(false);
}

async function toggleConnection(){
    if(device?.gatt?.connected) disconnect();
    else await connect();
}

let lastSend=0;
function run(speed){
    const now=Date.now();
    if(now-lastSend<100) return;
    lastSend=now;

    if(!output_characteristic || motor_ports.length === 0) return;

    if(motor_ports.length > 1){
        safeWrite(new Uint8Array([motor_ports[0],0x01,0x01,Number(-speed)]));
        safeWrite(new Uint8Array([motor_ports[1],0x01,0x01,Number(speed)]));
    }else{
        safeWrite(new Uint8Array([motor_ports[0],0x01,0x01,Number(speed)]));
    }
}

function brake(){
    if(!output_characteristic || motor_ports.length === 0) return;

    setSpeed(0, true);

    motor_ports.forEach(port => {
        safeWrite(new Uint8Array([port, 0x01, 0x02, 0]));
    });
}

function toggleLights(){
    if(lightsKnob.classList.contains("disabled")) return;
    if(!output_characteristic || lights_port===null) return;
    lightsOn=!lightsOn;
    lightsKnob.classList.toggle("active",lightsOn);

    safeWrite(
        new Uint8Array([lights_port,0x01,0x01,lightsOn?100:0])
    );
}

let speed=0;
const speedText=document.getElementById("speed-value");
let dragging=false;

function setSpeed(val, force=false){
    if((motor_ports.length === 0 || !device?.gatt?.connected) && !force) return;

    speed=Math.max(-100,Math.min(100,val));
    const rect=track.getBoundingClientRect();
    const percent=(speed+100)/200;
    const y=(1-percent)*rect.height;
    handle.style.top=(y-25)+"px";
    speedText.textContent="Speed: "+speed;
    if(!force) run(speed);
}

window.addEventListener("load",()=>{
    setSpeed(0, true);
});

function startDrag(){ if(motor_ports.length > 0 && device?.gatt?.connected) dragging=true; }
function stopDrag(){ dragging=false; }

handle.addEventListener("mousedown",startDrag);
document.addEventListener("mouseup",stopDrag);
handle.addEventListener("touchstart",startDrag,{passive:true});
document.addEventListener("touchend",stopDrag);

function move(clientY){
    if(!dragging) return;
    const rect=track.getBoundingClientRect();
    let y=clientY-rect.top;
    y=Math.max(0,Math.min(rect.height,y));
    let percent=1-(y/rect.height);
    setSpeed(Math.round((percent*200)-100));
}

document.addEventListener("mousemove",(e)=>move(e.clientY));
document.addEventListener("touchmove",(e)=>move(e.touches[0].clientY),{passive:false});

document.addEventListener("keydown",(e)=>{
    if(motor_ports.length > 0 && device?.gatt?.connected && ["ArrowUp","w","W"].includes(e.key)){
        e.preventDefault(); setSpeed(speed+5);
    }
    if(motor_ports.length > 0 && device?.gatt?.connected && ["ArrowDown","s","S"].includes(e.key)){
        e.preventDefault(); setSpeed(speed-5);
    }
    if(e.key===" "){ e.preventDefault(); brake(); }
    if(e.key.toLowerCase()==="l"){ toggleLights(); }
});

function isSupportedBrowser(){
    if (!navigator.bluetooth) return false;
    if (!window.isSecureContext) return false;
    if (navigator.userAgentData && navigator.userAgentData.brands) {
        const brands = navigator.userAgentData.brands.map(b => b.brand);
        const isChromeBrand = brands.includes("Google Chrome") || brands.includes("Chromium");
        if (!isChromeBrand) return false;
    } else {
        const ua = navigator.userAgent;
        const vendor = navigator.vendor || "";

        if (!vendor.includes("Google")) return false;

        if (!ua.includes("Chrome")) return false;
    }

    if (navigator.brave !== undefined) return false;
    const ua = navigator.userAgent;
    if (ua.includes("Edg") || ua.includes("OPR") || ua.includes("SamsungBrowser") || ua.includes("YaBrowser") || ua.includes("Vivaldi")) return false;

    return true;
}

window.addEventListener("load",()=>{
    if(!isSupportedBrowser()){
        document.getElementById("browser-warning").style.display = "block";
    }
});
</script>
</body>
</html>
